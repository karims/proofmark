[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofmark"
version = "0.1.0"
description = "Structured LLM output that has been tested, not just typed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "json-schema", "structured-output", "validation", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# No required dependencies. Providers speak HTTP over the standard library, and
# schema validation is implemented in-tree. Adding proofmark to a project should
# never drag in a dependency tree.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["proofmark", "proofmark.schema", "proofmark.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
